.template-frame {display:block;width:100%;height:100dvh;border:0;background:var(--background)}

.user-dashboard header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    padding:28px 38px;
    background:rgba(255,255,255,0.72);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
}
.user-dashboard header h1 {
    margin:0;
    font-size:2.1rem;
    line-height:1.2;
}
.user-dashboard header p {
    margin:0;
    color:var(--muted-foreground);
    font-size:0.82rem;
    letter-spacing:0.12em;
    text-transform:uppercase;
}
.user-dashboard .logout {
    margin-left:auto;
}
.user-dashboard .logout a {
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:0.7rem 1.2rem;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--foreground);
    font-weight:600;
    transition:all .2s ease;
}
.user-dashboard .logout a:hover {
    background:var(--muted);
    transform:translateY(-1px);
}
.user-dashboard .container {
    max-width:1180px;
    margin:0 auto;
    padding:32px 38px 48px;
}
.user-dashboard .welcome {
    background:linear-gradient(135deg, rgba(247,234,191,0.8), rgba(255,255,255,0.85));
    border:1px solid rgba(173, 142, 62, 0.2);
    border-radius:18px;
    padding:28px 30px;
    box-shadow:0 18px 45px rgba(22, 28, 34, 0.06);
    margin-bottom:28px;
}
.user-dashboard .welcome h2 {
    margin:0 0 12px;
    font-size:2.2rem;
    line-height:1.2;
    color:var(--foreground);
}
.user-dashboard .welcome h2 span {
    color:var(--secondary);
}
.user-dashboard .welcome p {
    margin:0;
    color:var(--muted-foreground);
    font-size:1rem;
    line-height:1.7;
    max-width:620px;
}
.user-dashboard .section-title {
    font-size:1.5rem;
    margin:0 0 18px;
    color:var(--foreground);
    display:flex;
    align-items:center;
    gap:12px;
}
.user-dashboard .section-title::before {
    content:"";
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--primary);
    box-shadow:0 0 0 6px rgba(243, 186, 76, 0.12);
}
.user-dashboard .mall-list {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:20px;
    align-items:stretch;
}
.user-dashboard .mall-card {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 20px 18px;
    box-shadow:0 12px 30px rgba(15, 23, 42, 0.04);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
}
.user-dashboard .mall-card::before {
    content:"";
    position:absolute;
    inset:0 auto auto 0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg, var(--primary), var(--secondary));
}
.user-dashboard .mall-card h2 {
    margin:0 0 14px;
    font-size:1.55rem;
    line-height:1.2;
}
.user-dashboard .mall-card p {
    margin:0 0 10px;
    color:var(--muted-foreground);
    font-size:0.93rem;
    line-height:1.7;
}
.user-dashboard .availability {
    margin-top:auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:max-content;
    min-height:34px;
    padding:0.55rem 0.8rem;
    background:rgba(116, 201, 84, 0.12);
    border:1px solid rgba(116, 201, 84, 0.2);
    color:#1f6b2d;
    border-radius:999px;
    font-size:0.78rem;
    font-weight:700;
    letter-spacing:0.03em;
    margin-bottom:18px;
}
.user-dashboard .mall-card button,
.user-dashboard .bookings button {
    width:100%;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg, var(--secondary), #2d3b63);
    color:#fff;
    font-weight:700;
    padding:0.85rem 1rem;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 10px 18px rgba(28, 34, 53, 0.16);
}
.user-dashboard .mall-card button:hover,
.user-dashboard .bookings button:hover {
    transform:translateY(-2px);
    box-shadow:0 14px 24px rgba(28, 34, 53, 0.22);
}
.user-dashboard .bookings {
    margin-top:28px;
    display:flex;
    justify-content:flex-end;
}
.user-dashboard .bookings a {
    display:block;
    width:min(220px, 100%);
}
.user-dashboard .message {
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px 20px;
    box-shadow:0 8px 22px rgba(15, 23, 42, 0.04);
}
.user-dashboard .message h3 {
    margin:0 0 8px;
    font-size:1.15rem;
}
.user-dashboard .message p {
    margin:0;
    color:var(--muted-foreground);
    line-height:1.6;
}

@media (max-width: 760px) {
    .user-dashboard header {
        padding:22px 20px;
        align-items:flex-start;
    }
    .user-dashboard .logout {
        margin-left:0;
    }
    .user-dashboard .container {
        padding:20px 20px 36px;
    }
    .user-dashboard .welcome {
        padding:20px 18px;
    }
    .user-dashboard .welcome h2 {
        font-size:1.7rem;
    }
    .user-dashboard .section-title {
        font-size:1.25rem;
    }
    .user-dashboard .books {
        justify-content:center;
    }
    .user-dashboard .bookings a {
        width:100%;
    }
}

    </style>

</head>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script>

        // ============================
        // LOAD CURRENT USER
        // ============================

        fetch('/user/current')
            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to get user");
                }

                return response.json();

            })
            .then(user => {

                if (user && user.name) {

                    document.getElementById("userName").textContent =
                        user.name;

                }

            })
            .catch(error => {

                console.error("User loading error:", error);

            });


        // ============================
        // LOAD REGISTERED MALLS
        // ============================

        fetch('/api/malls')
            .then(response => {

                if (!response.ok) {
                    throw new Error("Unable to get malls");
                }

                return response.json();

            })
            .then(malls => {

                const mallList =
                    document.getElementById("mallList");

                mallList.innerHTML = "";


                // No malls
                if (!malls || malls.length === 0) {

                    mallList.innerHTML = `
                        <div class="message">
                            <h3>No malls available</h3>
                            <p>
                                No malls have been registered yet.
                            </p>
                        </div>
                    `;

                    return;
                }


                // Display malls
                malls.forEach(mall => {

                    const card = document.createElement("div");

                    card.className = "mall-card";

                    card.innerHTML = `

                        <h2>
                             ${mall.mallName}
                        </h2>

                        <p>
                             ${mall.address}
                        </p>

                        <p>
                             ${mall.phone}
                        </p>

                        <div class="availability">
                             ${mall.availableSlots} of ${mall.totalSlots} parking slots available
                        </div>

                        <button onclick="viewMall(${mall.id})">
                            View Parking
                        </button>

                    `;

                    mallList.appendChild(card);

                });

            })
            .catch(error => {

                console.error("Mall loading error:", error);

                document.getElementById("mallList").innerHTML = `

                    <div class="message">

                        <h3>Unable to load malls</h3>

                        <p>
                            Please try again.
                        </p>

                    </div>

                `;

            });


        // ============================
        // VIEW MALL
        // ============================

        function viewMall(mallId) {

            window.location.href =
                "/mall.html?id=" + mallId;

        }

    </script>

</body>

</html>
